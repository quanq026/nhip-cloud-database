server {
    listen 80;
    server_name akaine.io.vn k8s.akaine.io.vn;
    return 308 https://akaine.io.vn$request_uri;
}

server {
    listen 443 ssl;
    server_name akaine.io.vn;
    ssl_certificate /etc/letsencrypt/live/akaine.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akaine.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=2592000" always;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:30080;
    }
}

server {
    listen 443 ssl;
    server_name k8s.akaine.io.vn;
    ssl_certificate /etc/letsencrypt/live/k8s.akaine.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k8s.akaine.io.vn/privkey.pem;
    return 308 https://akaine.io.vn$request_uri;
}
