apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhip-frontend
  namespace: nhip
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: nhip-frontend}
  template:
    metadata:
      labels: {app: nhip-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: nhip-frontend}}
          matchLabelKeys: [pod-template-hash]
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 10}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 10}
      containers:
        - name: nginx
          image: 10.44.1.10:5000/nhip-frontend:v1
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /livez, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: nginx-tmp, mountPath: /tmp}]
      volumes: [{name: nginx-tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: nhip-frontend
  namespace: nhip
spec:
  type: NodePort
  selector: {app: nhip-frontend}
  ports: [{name: http, port: 80, targetPort: 8080, nodePort: 30080}]
