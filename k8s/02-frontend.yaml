apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhip-frontend
  namespace: nhip
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: nhip-frontend}
  template:
    metadata:
      labels: {app: nhip-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
      initContainers:
        - name: nginx-config
          image: docker.io/quanq026/nhip-k8s-frontend:v1
          command: ["/bin/sh", "-c"]
          args:
            - 'sed -e "s/__NODE_NAME__/$NODE_NAME/g" -e "s/__POD_NAME__/$POD_NAME/g" /etc/nginx/nginx.conf > /generated/nginx.conf'
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: nginx-config, mountPath: /generated}]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: nhip-frontend}}
          matchLabelKeys: [pod-template-hash]
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 10}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 10}
      containers:
        - name: nginx
          image: docker.io/quanq026/nhip-k8s-frontend:v1
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /livez, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
      volumes:
        - {name: nginx-tmp, emptyDir: {}}
        - {name: nginx-config, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: nhip-frontend
  namespace: nhip
spec:
  type: NodePort
  selector: {app: nhip-frontend}
  ports: [{name: http, port: 80, targetPort: 8080, nodePort: 30080}]
