worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format nhip 'NHIP_ACCESS frontend_node=__NODE_NAME__ frontend_pod=__POD_NAME__ '
                    'method=$request_method path=$uri status=$status upstream=$upstream_addr '
                    'upstream_status=$upstream_status request_seconds=$request_time';
    access_log /dev/stdout nhip;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 8k;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = / { try_files /index.html =404; expires -1; }
        location /static/ {
            alias /usr/share/nginx/html/;
            add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /livez { access_log off; return 200 'ok'; }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Nhip-Frontend-Node "__NODE_NAME__";
            proxy_set_header X-Nhip-Frontend-Pod "__POD_NAME__";
            proxy_pass http://nhip-backend:8000;
        }
    }
}
